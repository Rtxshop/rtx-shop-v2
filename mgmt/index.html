<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود به پنل مدیریت | RTX Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Vazirmatn', sans-serif;
    background: linear-gradient(135deg, #0F0F1E, #1A1A2E);
    color: #F8FAFC; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .login-box {
    background: linear-gradient(135deg, #1A1A2E, #252540);
    border: 1px solid rgba(255, 184, 0, 0.3);
    border-radius: 20px; padding: 40px;
    max-width: 400px; width: 100%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  h1 {
    color: #FFB800; text-align: center;
    margin-bottom: 30px; font-size: 22px;
  }
  label {
    display: block; font-size: 13px;
    color: #FFB800; margin-bottom: 6px;
    font-weight: 700;
  }
  input {
    width: 100%; padding: 12px 14px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 184, 0, 0.3);
    border-radius: 10px; color: #F8FAFC;
    font-family: inherit; font-size: 14px;
    margin-bottom: 16px;
  }
  input:focus {
    outline: none; border-color: #FFB800;
    box-shadow: 0 0 0 4px rgba(255, 184, 0, 0.15);
  }
  button {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, #FFB800, #E5A500);
    color: #0F0F1E; border: none;
    border-radius: 10px; font-family: inherit;
    font-size: 15px; font-weight: 800;
    cursor: pointer; transition: all 0.3s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255, 184, 0, 0.4); }
  .msg {
    padding: 12px; border-radius: 10px;
    margin-bottom: 16px; font-size: 13px;
    text-align: center; display: none;
  }
  .msg.error {
    background: rgba(230, 57, 70, 0.15);
    color: #FF8A8A; border: 1px solid rgba(230, 57, 70, 0.5);
    display: block;
  }
</style>
</head>
<body>
  <div class="login-box">
    <h1>🔐 ورود به پنل مدیریت</h1>
    <div class="msg" id="msg"></div>
    <form id="loginForm">
      <label>👤 نام کاربری</label>
      <input type="text" id="username" required autocomplete="username">
      <label>🔑 رمز عبور</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit">🚀 ورود به پنل</button>
    </form>
  </div>

  <script>
    const ADMIN_USER = 'admin';
    const ADMIN_PASS = 'RtxShop2025!';

    if (sessionStorage.getItem('rtx_admin') === 'true') {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const msg = document.getElementById('msg');

      if (u === ADMIN_USER && p === ADMIN_PASS) {
        sessionStorage.setItem('rtx_admin', 'true');
        window.location.href = 'dashboard.html';
      } else {
        msg.textContent = '❌ نام کاربری یا رمز عبور اشتباهه';
        msg.className = 'msg error';
      }
    });
  </script>
</body>
</html>
